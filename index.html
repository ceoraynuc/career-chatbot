<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Counselling Chatbot</title>
  <link rel="stylesheet" href="style.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Typography+Font&display=swap" rel="stylesheet">

  <style>
    /* General body styles */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 30px;
      background-color: #1a1a1a;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-family: 'Typography Font', sans-serif;
      color: #ffffff;
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    .input-group {
      margin-top: 20px;
    }

    .form-control {
      background-color: #333;
      border: 1px solid #444;
      color: #e0e0e0;
    }

    .form-control:focus {
      background-color: #444;
      border-color: #666;
      color: #fff;
    }

    .btn-primary {
      background-color: #444;
      border-color: #666;
    }

    .btn-primary:hover {
      background-color: #555;
      border-color: #777;
    }

    #chatbox {
      margin-bottom: 30px;
      padding: 20px;
      background-color: #2c2c2c;
      border-radius: 10px;
      height: 300px;
      overflow-y: scroll;
    }

    .developer-info {
      background-color: #222;
      padding: 15px;
      border-radius: 8px;
      margin-top: 30px;
    }

    .developer-info p {
      color: #ccc;
      font-size: 1.1em;
    }

    .developer-info strong {
      color: #fff;
    }

    .developer-info a {
      color: #aaa;
      text-decoration: none;
    }

    .developer-info a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center">Career Counselling Chatbot</h1>
    <div id="chatbox"></div>
    <div class="input-group">
      <input type="text" id="userInput" class="form-control" placeholder="Type your message..." aria-label="Type your message">
      <button id="sendButton" class="btn btn-primary">Send</button>
    </div>
    <div class="developer-info mt-4">
      <p>Developed by <strong>Rayyan Ahmed</strong>, a passionate student studying at <strong>TCF College XI-A</strong>. Rayyan is dedicated to helping students make informed career choices and aims to contribute to the field of technology and education.</p>
      <!-- <p><strong>About TCF:</strong> The Citizens Foundation (TCF) is a non-profit organization in Pakistan that provides quality education to underprivileged children. TCF Schools and Colleges are known for their excellent academic environment and focus on character building.</p> -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
